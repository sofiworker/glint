[workspace]
resolver = "3"
members = ["crates/glint-app", "crates/glint-core", "crates/glint-platform", "crates/glint-ui"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.92"
publish = false
license = "GPL-3.0-only"

[workspace.dependencies]
glint-ui = { path = "crates/glint-ui" }
glint-core = { path = "crates/glint-core" }
glint-platform = { path = "crates/glint-platform" }
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2", "unstable-winit-030"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
arboard = { version = "3.7", default-features = false, features = ["image-data"] }
tiny-skia = { version = "=0.12.0", default-features = false, features = ["std", "simd"] }
serde = { version = "=1.0.229", features = ["derive"] }
toml = "=1.1.8"
tray-icon = "=0.19.3"
raw-window-handle = "0.6"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["registry", "std"] }
file-rotate = "=0.8.0"
windows = { version = "0.58", features = ["Data_Xml_Dom", "UI_Notifications", "Foundation", "Win32_System_WinRT", "Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_SystemInformation", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_ProcessStatus", "Win32_System_RemoteDesktop", "Win32_System_Threading", "Win32_UI_Controls_Dialogs", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
debug = 0

# Keep interactive software rendering usable in the RustRover development build.
[profile.dev.package.i-slint-renderer-software]
opt-level = 2

[profile.dev.package.tiny-skia]
opt-level = 2
